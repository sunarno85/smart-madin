version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartmadin-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartmadin
      POSTGRES_USER: smartmadin
      POSTGRES_PASSWORD: smartmadin_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartmadin"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../
      dockerfile: docker/Dockerfile.api
    container_name: smartmadin-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://smartmadin:smartmadin_password@postgres:5432/smartmadin
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-refresh-in-production}
      API_PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../
      dockerfile: docker/Dockerfile.web
    container_name: smartmadin-web
    restart: unless-stopped
    ports:
      - "80:80"

volumes:
  postgres_data:
